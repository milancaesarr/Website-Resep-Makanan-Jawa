<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detail Produk - NusaJava Eats</title>
  <link rel="stylesheet" href="produk-detail.css" >
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

    </div>
    <ul class="nav-links">
