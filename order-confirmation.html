<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Konfirmasi Pesanan | NusaJava Eats</title>
  <link rel="stylesheet" href="src/pembayaran.css" />
  <style>
    .order-ok-container { max-width: 480px; margin: 52px auto 0 auto; background: #fff; border-radius:8px; padding: 30px 32px 35px 32px; box-shadow:0 3px 19px -7px #c5b4a477; border:1.1px solid #e4d9cb; }
    .order-ok-title { color:#df661a; font-weight:700; font-size:1.20em; margin-bottom:7px; }
    .order-ok-info { color:#564d43; margin-bottom:14px; }
    .order-ok-num { font-size: 1.06em; font-weight: 550; color: #974800; }
    .order-ok-sumtable { margin:32px 0 17px 0; width:100%; border-collapse:collapse; }
    .order-ok-sumtable td { padding:6px 0; }
    .order-ok-sumtable .oktable-label { color:#867258; }
    .order-ok-sumtable .oktable-total { color:#c13c06; font-weight:700; }
    .order-ok-bca { font-weight:600; color:#245792; font-size:.98em; margin:14px 0 6px 0; }
    .order-ok-instructions { color:#3a2c16; font-size:.98em; background:#f6f3ee; padding:11px 14px; border-radius:5px; margin-bottom:9px; border:1.1px solid #fae9da; }
    .order-ok-btn { margin-top:20px; background:#e5691a; color:#fff; border:none; border-radius:4px; font-weight:600; font-size:1.08em; padding:11px 0; width:100%; cursor:pointer; transition:background .18s; box-shadow:0 1px 0 #ffd0ab; }
    .order-ok-btn:hover { background:#bc5507; }
  </style>
</head>
<body>
  <nav class="navbar" id="mainNavbar">
    <div class="logo">
      <img src="Assets/Img/NusaJava Eats.png" alt="Logo">
      <span class="logo-text">NusaJava Eats</span>
    </div>
  </nav>
  <main>
    <div class="order-ok-container" id="confirmBox">
      <!-- Konten akan diisi JS  -->
    </div>
  </main>
  <script src="src/order-confirmation.js"></script>
</body>
</html>
